        "description": "Canonical topics: simulation.frame, runtime.state, link.metric, jammer.event, switch.event. Simulation commands use REST; node state is carried by simulation.frame payload. Envelope requires type, schemaVersion=1.0, topic, taskId, sequence, optional simulationTime/frameId, payload. Reject non-loopback peer, invalid envelope, or forbidden topic with close 1008. Sequence is strictly increasing per task/topic. Client reconnects after 250 ms, 500 ms, 1000 ms, 2000 ms, then FAILED; it supplies lastSequence and receives deterministic replay or SEQUENCE_GAP.",
