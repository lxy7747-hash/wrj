        "tags": [
          "websocket"
        ],
        "summary": "WebSocket upgrade on loopback only",
        "description": "Canonical topics: simulation.frame, runtime.state, link.metric, jammer.event, switch.event, mission.log, position.update. jammer.event and switch.event additionally carry received EngineJammerFrameUpdate and EngineSwitchFrameUpdate, preserving their engine frame id/time. position.update carries mission-owned position-file generations with an independent journal cursor and no engine frame/time envelope; it must not be treated as co-framed engine data. mission.log carries either incremental MissionLogUpdate or EngineConnectionDiagnostic, task/run scoped with its own cursor and no simulationTime/frameId: process output has no engine-issued frame time. HTTP console/position retrieval provides initial/recovery compensation; live additions are WebSocket records. websocketNew frame_id advances by 5 per 5 simulation seconds; this is independent of the per-topic WS sequence. FRAME_ADVANCE_OBSERVED records a delta differing from 5 without claiming upstream retransmission support. New fields are optional; the original single jammerExecution remains required. Simulation commands use REST; node state is carried by simulation.frame payload. Envelope requires type, schemaVersion=1.0, topic, taskId, sequence, optional simulationTime/frameId, payload. Reject unauthorized transport, invalid envelope, unknown task, or forbidden topic with close 1008. Sequence is strictly increasing per task/topic. Client reconnects after 250 ms, 500 ms, 1000 ms, 2000 ms, then FAILED; it supplies lastSequences keyed by subscribed topic for deterministic replay, with legacy lastSequence accepted for compatible clients. The local deployment persists an ordered journal per task/topic, so replay outside the 128-event hot cache uses bounded disk pages. Run/reset boundaries, missing records, corrupt journals or failed persistence produce SEQUENCE_GAP rather than silently skipping events. Different registered tasks have isolated subscriptions and cursors. A zero-cursor subscription starts from the current snapshot; REST resynchronization after SEQUENCE_GAP does not claim to recover missing history. link.metric additionally accepts EngineFrameSnapshot (kind=ENGINE_FRAME), with locally bound run/task, device-segment statuses and cached initial routes; it requires no simulation.frame. Existing summary and QUALITY_UPDATED payloads remain valid.",
