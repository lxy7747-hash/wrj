    "schemas": {
      "BackupPlan": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version",
          "enabled",
          "name",
          "intervalMinutes"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "enabled": {
            "type": "boolean"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "pattern": "\\S",
            "maxLength": 80
          },
          "intervalMinutes": {
            "type": "integer",
            "minimum": 60,
            "maximum": 10080
          }
        }
      },
      "BackupExecution": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "startedAt",
          "completedAt",
          "result",
          "backupId",
          "message"
        ],
        "properties": {
          "startedAt": {
            "type": "string",
            "format": "date-time"
          },
          "completedAt": {
            "type": "string",
            "format": "date-time"
          },
          "result": {
            "enum": [
              "SUCCESS",
              "FAILURE"
            ]
          },
          "backupId": {
            "oneOf": [
              {
                "type": "string",
                "minLength": 1,
                "pattern": "\\S"
              },
              {
                "type": "null"
              }
            ]
          },
          "message": {
            "type": "string",
            "minLength": 1,
            "pattern": "\\S"
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "result": {
                  "const": "SUCCESS"
                }
              },
              "required": [
                "result"
              ]
            },
            "then": {
              "properties": {
                "backupId": {
                  "type": "string",
                  "minLength": 1,
                  "pattern": "\\S"
                }
              }
            },
            "else": {
              "properties": {
                "backupId": {
                  "type": "null"
                }
              }
            }
          }
        ]
      },
      "BackupPlanStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "plan",
          "nextRunAt",
          "executions"
        ],
        "properties": {
          "plan": {
            "$ref": "#/components/schemas/BackupPlan"
          },
          "nextRunAt": {
            "oneOf": [
              {
                "type": "string",
                "format": "date-time"
              },
              {
                "type": "null"
              }
            ]
          },
          "executions": {
            "type": "array",
            "maxItems": 20,
            "items": {
              "$ref": "#/components/schemas/BackupExecution"
            }
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "plan": {
                  "properties": {
                    "enabled": {
                      "const": true
                    }
                  },
                  "required": [
                    "enabled"
                  ]
                }
              },
              "required": [
                "plan"
              ]
            },
            "then": {
              "properties": {
                "nextRunAt": {
                  "type": "string",
                  "format": "date-time"
                }
              }
            },
            "else": {
              "properties": {
                "nextRunAt": {
                  "type": "null"
                }
              }
            }
          }
        ]
      },
